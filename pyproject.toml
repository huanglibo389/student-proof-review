[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "student-proof-review"
version = "0.1.0"
description = "Local-first workflow for transcribing, auditing, and delivering student math proof reviews"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0",
  "requests>=2.31",
]

[project.scripts]
student-proof-review = "student_proof_review.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
